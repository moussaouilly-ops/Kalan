# Fichier de configuration Render — décrit automatiquement les services à
# créer (backend Django + base PostgreSQL) quand ce dépôt est connecté via
# "New +" → "Blueprint" sur render.com.
#
# Doc : https://render.com/docs/blueprint-spec

databases:
  - name: kalan-db
    plan: free
    databaseName: kalan
    user: kalan

services:
  - type: web
    name: kalan-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createsuperuser --noinput || true"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: kalan-db
          property: connectionString
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: PYTHON_VERSION
        value: "3.13.0"
